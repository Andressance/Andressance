<svg xmlns="http://www.w3.org/2000/svg" width="420" height="110" viewBox="0 0 420 110" role="img" aria-label="Sale a Devolver, beta, demo disponible">
<style>@font-face{font-family:'Type';src:url(data:font/woff2;base64,) format('woff2')}
.d{font-family:'Display',system-ui,sans-serif;font-weight:800}
.t{font-family:'Type','Courier New',monospace}
.h{font-family:'Hand','Segoe Print',cursive;font-weight:700}

.st{transform-box:fill-box;transform-origin:center;animation:stamp 7s cubic-bezier(.2,.9,.3,1.2) infinite both}
@keyframes stamp{0%{transform:scale(2.6);opacity:0}6%{transform:scale(.94);opacity:1}9%{transform:scale(1)}
 12%{transform:translate(2px,-1px)}14%{transform:translate(-2px,1px)}16%,92%{transform:none;opacity:1}100%{opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g transform="translate(210.0 55.0) rotate(-3) translate(-210.0 -55.0)"><g class="st" style="animation-delay:0s"><rect x="20" y="14" width="380" height="82" rx="3" fill="#c8372d" fill-opacity=".10" stroke="#c8372d" stroke-width="3"/><rect x="26" y="20" width="368" height="70" rx="2" fill="none" stroke="#c8372d" stroke-width="1.5"/><text class="t" x="210.0" y="48.4" text-anchor="middle" font-size="24" letter-spacing="3" fill="#c8372d">BETA · DEMO DISPONIBLE</text><text class="t" x="210.0" y="78.4" text-anchor="middle" font-size="24" letter-spacing="3" fill="#c8372d">Sale a Devolver</text></g></g>
</svg>

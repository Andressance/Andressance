<svg xmlns="http://www.w3.org/2000/svg" width="900" height="84" viewBox="0 0 900 84" role="img" aria-label="Hall of Fame">
<style>@font-face{font-family:'Display';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Type';src:url(data:font/woff2;base64,) format('woff2')}
.d{font-family:'Display',system-ui,sans-serif;font-weight:800}
.t{font-family:'Type','Courier New',monospace}
.h{font-family:'Hand','Segoe Print',cursive;font-weight:700}

.bar{animation:grow .9s ease-out both;transform-origin:0 0;transform-box:fill-box}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ttl{animation:slide .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes slide{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
.tag{animation:slide .7s .25s ease-out both}
.dot{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.15}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="900" height="84" fill="#0b3a73"/><rect class="bar" y="79" width="900" height="5" fill="#f2b705"/><rect width="900" height="84" fill="#fff" fill-opacity=".0"/><g class="ttl"><text class="d" x="26" y="60" font-size="40" fill="#f5eee0">Hall of Fame</text></g><g class="tag"><circle class="dot" cx="547" cy="38.0" r="5" fill="#c8372d"/><text class="t" x="874" y="44.0" font-size="18" fill="#f2b705" text-anchor="end" letter-spacing="2">EXPEDIENTE 06 · JAMS Y BOTS</text></g>
</svg>
